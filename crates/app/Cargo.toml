[package]
name = "cao_app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cao_part = { path = "../part" }
cao_prefs = { path = "../prefs" }
cao_render = { path = "../render" }
cao_sketch = { path = "../sketch" }
cao_solid = { path = "../solid" }
chrono.workspace = true
directories.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
glam.workspace = true
rfd.workspace = true
serde_json.workspace = true
trash.workspace = true
wgpu.workspace = true

[features]
# Where the view shows a point of the drawing, for the driver tests that click
# it there. The application never asks.
test-support = []

# The crate itself, with that switched on, for its integration tests.
[dev-dependencies]
cao_app = { path = ".", features = ["test-support"] }
cao_part = { path = "../part", features = ["test-support"] }
cao_prefs = { path = "../prefs", features = ["test-support"] }
egui_kittest.workspace = true
serde_json.workspace = true

[lib]
name = "cao_app"
path = "src/lib.rs"

[[bin]]
name = "cao"
path = "src/main.rs"
