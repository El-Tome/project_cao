name: CI

# Every branch, and pull_request deliberately absent: with both, each push to a
# branch under review would run the whole workflow twice.
on:
  push:
    branches: ['**']

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci-deps-ubuntu.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci-deps-ubuntu.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build-windows:
    name: Windows executable
    runs-on: ubuntu-latest
    # A mirror that stops answering froze this job for 46 minutes (#686):
    # bounded, it fails red and is re-run instead of running for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci-apt-sources.sh && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 -o Acquire::http::Timeout=30 mingw-w64
        name: Install mingw-w64
        timeout-minutes: 10
      - run: rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: cao-windows
          path: target/x86_64-pc-windows-gnu/release/cao.exe
