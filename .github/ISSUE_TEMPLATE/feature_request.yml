name: Feature request
description: Something CAO could let you do that it does not yet.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you are trying to do
      description: The task, not the button. What are you making, and where do you get stuck?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you picture it
      description: The gestures you would make, and what you would see. A sketch on paper is welcome.
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: A workaround, or another program that does it well.
